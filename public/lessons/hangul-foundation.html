<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хулан · Хангылын эхний алхам</title>
  <style>
    html, body, iframe { width:100%; height:100%; margin:0; border:0; background:#fcf9fa; }
    body { overflow:hidden; }
  </style>
</head>
<body>
  <iframe id="lesson" src="./hangul-review-source.html" title="Хангылын эхний алхам"></iframe>
  <script>
    document.querySelector("#lesson").addEventListener("load", (event) => {
      const documentRoot = event.currentTarget.contentDocument;
      const reviewBanner = documentRoot?.body?.firstElementChild;
      if (reviewBanner?.textContent?.includes("ХЯНАХ ХУВИЛБАР")) reviewBanner.remove();
      const homeLink = documentRoot?.querySelector("header a");
      if (homeLink) { homeLink.href = "/"; homeLink.target = "_top"; }
    });
  </script>
</body>
</html>
